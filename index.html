<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام إدارة نشاط البحص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --stone-900:#211f1c;
  --stone-800:#332f2a;
  --stone-700:#4a443c;
  --sand-100:#e9e2d3;
  --sand-50:#f2ede2;
  --clay-600:#b8541f;
  --clay-700:#963f14;
  --slate-500:#5b6b75;
  --moss-600:#4a6b52;
  --danger:#a13a2f;
  --white:#fffdf9;
  --line:#d9cfba;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'IBM Plex Sans Arabic', 'Tajawal', sans-serif;
  background:var(--sand-50);
  color:var(--stone-900);
  min-height:100vh;
}
.app{ display:flex; min-height:100vh; }

/* Sidebar */
.sidebar{
  width:230px; background:var(--stone-900); color:var(--sand-100);
  display:flex; flex-direction:column; flex-shrink:0;
  border-left:5px solid var(--clay-600);
}
.brand{
  padding:22px 18px 16px; border-bottom:1px solid rgba(255,255,255,.08);
}
.brand h1{
  font-family:'Tajawal',sans-serif; font-weight:900; font-size:19px; line-height:1.3;
  color:var(--white);
}
.brand span{ display:block; font-size:11px; color:var(--sand-100); opacity:.55; margin-top:4px; letter-spacing:.5px;}
nav{ padding:14px 10px; display:flex; flex-direction:column; gap:3px; flex:1; }
.nav-btn{
  display:flex; align-items:center; gap:10px;
  background:none; border:none; color:var(--sand-100); opacity:.8;
  padding:11px 12px; border-radius:8px; font-size:14.5px; font-weight:500;
  cursor:pointer; text-align:right; font-family:inherit; transition:.15s;
}
.nav-btn:hover{ background:rgba(255,255,255,.06); opacity:1; }
.nav-btn.active{ background:var(--clay-600); color:var(--white); opacity:1; font-weight:700;}
.nav-icon{ font-size:17px; width:20px; text-align:center; }
.sidebar-foot{ padding:14px 18px; font-size:10.5px; color:var(--sand-100); opacity:.4; border-top:1px solid rgba(255,255,255,.08);}

/* Main */
main{ flex:1; padding:26px 34px; overflow-x:auto; }
.page-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:10px;}
.page-title h2{ font-family:'Tajawal',sans-serif; font-weight:900; font-size:24px; color:var(--stone-900);}
.page-title p{ font-size:13px; color:var(--stone-700); opacity:.65; margin-top:2px;}

.btn{
  background:var(--clay-600); color:var(--white); border:none; padding:10px 18px;
  border-radius:8px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer;
  transition:.15s;
}
.btn:hover{ background:var(--clay-700); }
.btn.secondary{ background:transparent; color:var(--stone-800); border:1.5px solid var(--line);}
.btn.secondary:hover{ background:var(--sand-100); }
.btn.danger{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); padding:6px 12px; font-size:12.5px;}
.btn:focus-visible, .nav-btn:focus-visible, input:focus-visible, select:focus-visible{ outline:2.5px solid var(--slate-500); outline-offset:2px; }

/* Cards / KPIs */
.kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:24px;}
.kpi{
  background:var(--white); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  border-top:4px solid var(--slate-500);
}
.kpi.clay{ border-top-color:var(--clay-600); }
.kpi.moss{ border-top-color:var(--moss-600); }
.kpi.danger{ border-top-color:var(--danger); }
.kpi .label{ font-size:12.5px; color:var(--stone-700); opacity:.7; font-weight:500;}
.kpi .value{ font-family:'Tajawal',sans-serif; font-size:26px; font-weight:900; margin-top:6px; color:var(--stone-900);}
.kpi .sub{ font-size:11.5px; color:var(--stone-700); opacity:.55; margin-top:3px;}

.panel{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:20px;}
.panel h3{ font-family:'Tajawal',sans-serif; font-size:16px; font-weight:700; margin-bottom:14px; color:var(--stone-900);}

table{ width:100%; border-collapse:collapse; font-size:13.5px;}
th{ text-align:right; padding:10px 8px; color:var(--stone-700); font-weight:700; border-bottom:2px solid var(--line); font-size:12.5px; white-space:nowrap;}
td{ padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap;}
tr:hover td{ background:var(--sand-50); }
.empty-row td{ text-align:center; padding:30px; color:var(--stone-700); opacity:.5; }
.pill{ padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
.pill.paid{ background:#e5efe6; color:var(--moss-600); }
.pill.unpaid{ background:#f7e5e1; color:var(--danger); }
.pill.partial{ background:#fbf0d9; color:#8a6516; }

.form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:14px;}
label{ font-size:12.5px; font-weight:600; color:var(--stone-700); display:block; margin-bottom:5px;}
input, select{
  width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:7px;
  font-family:inherit; font-size:13.5px; background:var(--white); color:var(--stone-900);
}
.actions-row{ display:flex; gap:10px; justify-content:flex-start; }

.section{ display:none; }
.section.active{ display:block; }

.empty-state{ text-align:center; padding:50px 20px; color:var(--stone-700); }
.empty-state .icon{ font-size:38px; margin-bottom:10px; opacity:.5;}
.empty-state p{ opacity:.6; font-size:13.5px; }

.tag-del{ background:none; border:none; cursor:pointer; color:var(--danger); font-size:15px; padding:4px 6px; border-radius:5px;}
.tag-del:hover{ background:#f7e5e1; }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--stone-900); color:var(--white); padding:11px 20px; border-radius:9px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:.25s;
  z-index:999; box-shadow:0 6px 20px rgba(0,0,0,.2);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

@media(max-width:760px){
  .app{ flex-direction:column; }
  .sidebar{ width:100%; flex-direction:row; overflow-x:auto; border-left:none; border-bottom:5px solid var(--clay-600);}
  .brand{ display:none; }
  nav{ flex-direction:row; padding:10px; }
  .nav-btn{ white-space:nowrap; }
  .sidebar-foot{ display:none; }
  main{ padding:14px; }
  .page-title{ flex-direction:column; align-items:flex-start; }
  .toolbar{ width:100%; }
  .toolbar .btn, .toolbar .btn.secondary{ flex:1; }
  table{ font-size:12px; }
  th, td{ padding:8px 6px; }
}

/* Toolbar (export / print) */
.toolbar{ display:flex; gap:8px; flex-wrap:wrap; }
.toolbar .btn.secondary{ padding:9px 14px; font-size:13px; }

/* Attachments */
.tag-attach{ background:none; border:none; cursor:pointer; font-size:15px; padding:4px 6px; border-radius:5px; position:relative; }
.tag-attach:hover{ background:var(--sand-100); }
.attach-badge{ position:absolute; top:-2px; left:-4px; background:var(--clay-600); color:var(--white); border-radius:50%; font-size:9.5px; width:15px; height:15px; display:flex; align-items:center; justify-content:center; font-weight:700; }
.modal-overlay{ position:fixed; inset:0; background:rgba(33,31,28,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
.modal-overlay.show{ display:flex; }
.modal-box{ background:var(--white); border-radius:14px; max-width:480px; width:100%; max-height:80vh; overflow-y:auto; padding:22px; }
.modal-box h3{ font-family:'Tajawal',sans-serif; font-size:16.5px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.modal-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--stone-700); }
.attach-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.attach-item a{ color:var(--slate-500); text-decoration:none; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:260px; }
.attach-item a:hover{ text-decoration:underline; }
.attach-empty{ text-align:center; color:var(--stone-700); opacity:.55; padding:16px 0; font-size:13px; }

@media print{
  .sidebar, .btn, .toolbar, .tag-del, .tag-attach, form, .modal-overlay{ display:none !important; }
  main{ padding:0; }
  .panel{ border:1px solid #ccc; break-inside:avoid; }
  body{ background:#fff; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>نشاط البحص</h1>
      <span>نظام إدارة وحسابات</span>
    </div>
    <nav id="navBar"></nav>
    <div class="sidebar-foot">تُحفظ بياناتك محلياً على هذا الجهاز (قاعدة بيانات داخلية IndexedDB) — خذ نسخة احتياطية بشكل دوري من صفحة "النسخ الاحتياطي"</div>
  </aside>
  <main id="mainArea"></main>
</div>
<div class="toast" id="toast"></div>

<div class="modal-overlay" id="attachModalOverlay">
  <div class="modal-box">
    <h3><span>المرفقات</span><button class="modal-close" id="attachModalClose">✕</button></h3>
    <div id="attachList"></div>
    <div style="margin-top:14px;">
      <label>إضافة مرفق (صورة أو PDF)</label>
      <input type="file" id="attachFileInput" accept="image/*,.pdf">
    </div>
  </div>
</div>

<script>
// ---------- Storage helpers (IndexedDB with localStorage fallback/migration) ----------
const KEY = 'gravel_biz_data_v1';
const IDB_NAME = 'gravel_biz_db';
const IDB_STORE = 'kv';
let DB = { customers:[], suppliers:[], products:[], sales:[], purchases:[], transport:[], expenses:[], crushers:[], production:[], vehicles:[], drivers:[], vehicleExpenses:[], assets:[], warehouses:[], stock:[], transfers:[], vouchers:[], attachments:[] };
let loaded = false;
let idbAvailable = true;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no-idb')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(val,key);
    tx.oncomplete = ()=> resolve(true);
    tx.onerror = ()=> reject(tx.error);
  });
}

function ensureDefaults(){
  DB.crushers = DB.crushers || [];
  DB.production = DB.production || [];
  DB.vehicles = DB.vehicles || [];
  DB.drivers = DB.drivers || [];
  DB.vehicleExpenses = DB.vehicleExpenses || [];
  DB.assets = DB.assets || [];
  DB.warehouses = DB.warehouses || [];
  DB.stock = DB.stock || [];
  DB.transfers = DB.transfers || [];
  DB.vouchers = DB.vouchers || [];
  DB.attachments = DB.attachments || [];
  if(DB.warehouses.length===0){
    DB.warehouses.push({ id:uid(), name:'المخزن الرئيسي', location:'' });
  }
  // make sure every product has a stock row in some warehouse reflecting its qty
  const mainWh = DB.warehouses[0].id;
  DB.products.forEach(p=>{
    const totalInStock = DB.stock.filter(s=>s.productId===p.id).reduce((a,s)=>a+s.qty,0);
    const diff = (p.qty||0) - totalInStock;
    if(Math.abs(diff) > 0.0001){
      let row = DB.stock.find(s=>s.productId===p.id && s.warehouseId===mainWh);
      if(!row){ row = { id:uid(), productId:p.id, warehouseId:mainWh, qty:0 }; DB.stock.push(row); }
      row.qty += diff;
    }
  });
}

async function loadDB(){
  try{
    const idbVal = await idbGet(KEY);
    if(idbVal){ DB = idbVal; }
    else {
      // migrate from localStorage if present
      const raw = localStorage.getItem(KEY);
      if(raw) DB = JSON.parse(raw);
    }
  }catch(e){
    idbAvailable = false;
    try{ const raw = localStorage.getItem(KEY); if(raw) DB = JSON.parse(raw); }catch(e2){ /* fresh start */ }
  }
  ensureDefaults();
  loaded = true;
  await saveDB();
}
async function saveDB(){
  try{
    await idbSet(KEY, DB);
  }catch(e){
    idbAvailable = false;
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e2){ console.error('storage error', e2); showToast('تعذر الحفظ — المساحة ممتلئة أو المتصفح لا يدعم التخزين'); }
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ar-EG'); }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ---------- Navigation ----------
const PAGES = [
  {id:'dashboard', label:'الرئيسية', icon:'🏠'},
  {id:'crushers', label:'الكسارات', icon:'🏭'},
  {id:'inventory', label:'المخزون', icon:'⛰️'},
  {id:'warehouses', label:'المخازن', icon:'🏬'},
  {id:'assets', label:'الأصول الثابتة', icon:'🏗️'},
  {id:'sales', label:'المبيعات', icon:'🧾'},
  {id:'purchases', label:'المشتريات', icon:'📥'},
  {id:'transport', label:'حركة النقل', icon:'🚚'},
  {id:'fleet', label:'الأسطول والسائقين', icon:'🚛'},
  {id:'finance', label:'الحسابات المالية', icon:'💰'},
  {id:'vouchers', label:'سندات القبض والصرف', icon:'🧮'},
  {id:'contacts', label:'العملاء والموردون', icon:'👥'},
  {id:'backup', label:'النسخ الاحتياطي والتصدير', icon:'💾'},
];
let currentPage = 'dashboard';

function renderNav(){
  const nav = document.getElementById('navBar');
  nav.innerHTML = PAGES.map(p=>`
    <button class="nav-btn ${p.id===currentPage?'active':''}" data-page="${p.id}">
      <span class="nav-icon">${p.icon}</span><span>${p.label}</span>
    </button>`).join('');
  nav.querySelectorAll('.nav-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ currentPage=b.dataset.page; renderNav(); renderPage(); });
  });
}

function renderPage(){
  const main = document.getElementById('mainArea');
  if(currentPage==='dashboard') main.innerHTML = pageDashboard();
  else if(currentPage==='crushers') main.innerHTML = pageCrushers();
  else if(currentPage==='inventory') main.innerHTML = pageInventory();
  else if(currentPage==='warehouses') main.innerHTML = pageWarehouses();
  else if(currentPage==='assets') main.innerHTML = pageAssets();
  else if(currentPage==='sales') main.innerHTML = pageSales();
  else if(currentPage==='purchases') main.innerHTML = pagePurchases();
  else if(currentPage==='transport') main.innerHTML = pageTransport();
  else if(currentPage==='fleet') main.innerHTML = pageFleet();
  else if(currentPage==='finance') main.innerHTML = pageFinance();
  else if(currentPage==='vouchers') main.innerHTML = pageVouchers();
  else if(currentPage==='contacts') main.innerHTML = pageContacts();
  else if(currentPage==='backup') main.innerHTML = pageBackup();
  injectToolbar();
  attachHandlers();
  attachAttachButtons();
}

function injectToolbar(){
  const titleBlock = document.querySelector('.page-title');
  if(!titleBlock) return;
  const bar = document.createElement('div');
  bar.className = 'toolbar';
  bar.innerHTML = `
    <button class="btn secondary" id="btnPrintPage">🖨️ طباعة</button>
    <button class="btn secondary" id="btnExportExcel">📊 تصدير Excel</button>`;
  titleBlock.appendChild(bar);
  document.getElementById('btnPrintPage').addEventListener('click', ()=> window.print());
  document.getElementById('btnExportExcel').addEventListener('click', exportCurrentPageExcel);
}

function exportCurrentPageExcel(){
  if(typeof XLSX==='undefined'){ showToast('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت'); return; }
  const tables = document.querySelectorAll('#mainArea table');
  if(tables.length===0){ showToast('لا توجد بيانات لتصديرها في هذه الصفحة'); return; }
  const wb = XLSX.utils.book_new();
  tables.forEach((table, i)=>{
    let sheetName = 'بيانات'+(i+1);
    let el = table.closest('.panel');
    const h3 = el ? el.querySelector('h3') : null;
    if(h3) sheetName = h3.textContent.trim().replace(/[\\/*?:\[\]]/g,'').slice(0,28) || sheetName;
    const ws = XLSX.utils.table_to_sheet(table);
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  const pageLabel = (PAGES.find(p=>p.id===currentPage)||{}).label || 'بيانات';
  XLSX.writeFile(wb, `${pageLabel}.xlsx`);
  showToast('تم تصدير الملف');
}

// ---------- Calculations ----------
function stockValue(){
  return DB.products.reduce((s,p)=> s + (p.qty * p.cost), 0);
}
function totalSales(){ return DB.sales.reduce((s,x)=>s+x.total,0); }
function totalPurchases(){ return DB.purchases.reduce((s,x)=>s+x.total,0); }
function totalTransportCost(){ return DB.transport.reduce((s,x)=>s+(x.cost||0),0); }
function totalExpenses(){ return DB.expenses.reduce((s,x)=>s+x.amount,0); }
function totalProductionCost(){ return DB.production.reduce((s,x)=>s+(x.cost||0),0); }
function totalVehicleExpenses(){ return DB.vehicleExpenses.reduce((s,x)=>s+(x.amount||0),0); }
function totalDepreciation(){ return DB.assets.reduce((s,a)=>s+assetAccumDep(a),0); }
function receivables(){ return DB.sales.reduce((s,x)=>s+(x.total-x.paid),0); }
function payables(){ return DB.purchases.reduce((s,x)=>s+(x.total-x.paid),0); }
function netProfit(){
  return totalSales() - totalPurchases() - totalTransportCost() - totalExpenses() - totalProductionCost() - totalVehicleExpenses() - totalDepreciation();
}
function customerName(id){ const c=DB.customers.find(x=>x.id===id); return c?c.name:'—'; }
function supplierName(id){ const s=DB.suppliers.find(x=>x.id===id); return s?s.name:'—'; }
function productName(id){ const p=DB.products.find(x=>x.id===id); return p?p.name:'—'; }
function productUnit(id){ const p=DB.products.find(x=>x.id===id); return p?p.unit:''; }
function crusherName(id){ const c=DB.crushers.find(x=>x.id===id); return c?c.name:'—'; }
function vehicleLabel(id){ const v=DB.vehicles.find(x=>x.id===id); return v?(v.plateNo+(v.type?' - '+v.type:'')):'—'; }
function driverRegName(id){ const d=DB.drivers.find(x=>x.id===id); return d?d.name:'—'; }
function warehouseName(id){ const w=DB.warehouses.find(x=>x.id===id); return w?w.name:'—'; }
function mainWarehouseId(){ return DB.warehouses.length? DB.warehouses[0].id : null; }
function stockQty(productId, warehouseId){
  const s = DB.stock.find(x=>x.productId===productId && x.warehouseId===warehouseId);
  return s ? s.qty : 0;
}
function addStock(productId, warehouseId, qty){
  if(!warehouseId) warehouseId = mainWarehouseId();
  let s = DB.stock.find(x=>x.productId===productId && x.warehouseId===warehouseId);
  if(!s){ s = { id:uid(), productId, warehouseId, qty:0 }; DB.stock.push(s); }
  s.qty += qty;
}
function removeStock(productId, warehouseId, qty){ addStock(productId, warehouseId, -qty); }

// ---------- Fixed assets: depreciation (straight-line) ----------
function assetAnnualDep(a){
  const life = a.usefulLife || 1;
  return (a.cost - (a.salvage||0)) / life;
}
function assetAccumDep(a){
  const start = new Date(a.purchaseDate);
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(months < 0) months = 0;
  const monthly = assetAnnualDep(a) / 12;
  let accum = monthly * months;
  const max = a.cost - (a.salvage||0);
  if(accum > max) accum = max;
  if(accum < 0) accum = 0;
  return accum;
}
function assetBookValue(a){ return a.cost - assetAccumDep(a); }
function totalAssetsBookValue(){ return DB.assets.reduce((s,a)=>s+assetBookValue(a),0); }

// ---------- Dashboard ----------
function pageDashboard(){
  const recentTransport = [...DB.transport].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  return `
    <div class="page-title">
      <div><h2>نظرة عامة</h2><p>ملخص حالة النشاط اليوم</p></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi clay"><div class="label">قيمة المخزون الحالي</div><div class="value">${fmt(stockValue())}</div><div class="sub">جنيه</div></div>
      <div class="kpi moss"><div class="label">إجمالي المبيعات</div><div class="value">${fmt(totalSales())}</div><div class="sub">جنيه</div></div>
      <div class="kpi"><div class="label">إجمالي المشتريات</div><div class="value">${fmt(totalPurchases())}</div><div class="sub">جنيه</div></div>

          <td>${statusPill(s.total,s.paid)}</td><td><button class="tag-attach" data-attach="sale:${s.id}">📎${attachBadge(s)}</button><button class="tag-del" data-del-sale="${s.id}">🗑️</button></td></tr>

function statusPill(total,paid){
  if(paid>=total) return `<span class="pill paid">مدفوعة</span>`;
  if(paid<=0) return `<span class="pill unpaid">غير مدفوعة</span>`;
  return `<span class="pill partial">جزئي</span>`;
}

function fleetReportTable(from, to){
  const trips = DB.transport.filter(t=>{
    if(from && t.date < from) return false;
    if(to && t.date > to) return false;
    return true;
  });
  const byVehicle = {};
  trips.forEach(t=>{
    const key = t.vehicleId || ('نصي:'+(t.truckNo||'—'));
    if(!byVehicle[key]) byVehicle[key] = { label: t.vehicleId?vehicleLabel(t.vehicleId):(t.truckNo||'غير محدد'), trips:0, profit:0, vehicleId:t.vehicleId };
    byVehicle[key].trips += 1;
    byVehicle[key].profit += (t.profit||0);
  });
  const vehExpByVehicle = {};
  DB.vehicleExpenses.forEach(e=>{
    if(from && e.date < from) return;
    if(to && e.date > to) return;
    vehExpByVehicle[e.vehicleId] = (vehExpByVehicle[e.vehicleId]||0) + e.amount;
  });
  const rows = Object.values(byVehicle);
  if(rows.length===0) return `<div class="empty-state"><div class="icon">📊</div><p>لا توجد رحلات في هذه الفترة</p></div>`;
  return `
    <table>
      <thead><tr><th>السيارة</th><th>عدد الرحلات</th><th>إجمالي ربح الرحلات</th><th>مصاريف الوقود/الصيانة</th><th>صافي الربح</th></tr></thead>
      <tbody>
      ${rows.map(r=>{
        const exp = r.vehicleId ? (vehExpByVehicle[r.vehicleId]||0) : 0;
        const net = r.profit - exp;
        return `<tr><td>${r.label}</td><td>${r.trips}</td><td>${fmt(r.profit)}</td><td>${fmt(exp)}</td><td style="font-weight:700; color:${net>=0?'var(--moss-600)':'var(--danger)'}">${fmt(net)}</td></tr>`;
      }).join('')}
      </tbody>
    </table>`;
}

function openInvoicesForVoucher(type, partyId){
  if(type==='receipt'){

function downloadBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `نسخة-احتياطية-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('تم تنزيل النسخة الاحتياطية');
}
async function restoreBackup(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('bad-format');
    DB = parsed;
    ensureDefaults();
    await saveDB();
    showToast('تم استيراد النسخة الاحتياطية بنجاح');
    renderPage();
  }catch(e){
    showToast('تعذر قراءة الملف — تأكد أنه نسخة احتياطية صحيحة');
  }
}
function exportAllExcel(){
  if(typeof XLSX==='undefined'){ showToast('تعذر تحميل مكتبة Excel — تأكد من الاتصال بالإنترنت'); return; }
  const wb = XLSX.utils.book_new();
  const sheets = [
    ['العملاء', DB.customers],
    ['الموردون', DB.suppliers],
    ['المخزون', DB.products],
    ['المخازن', DB.warehouses],
    ['توزيع_المخزون', DB.stock.map(s=>({الصنف:productName(s.productId), المخزن:warehouseName(s.warehouseId), الكمية:s.qty}))],
    ['المبيعات', DB.sales.map(s=>({...s, العميل:customerName(s.customerId), الصنف:productName(s.productId)}))],
    ['المشتريات', DB.purchases.map(p=>({...p, المورد:supplierName(p.supplierId), الصنف:productName(p.productId)}))],
    ['حركة_النقل', DB.transport],
    ['المصروفات', DB.expenses],
    ['الكسارات', DB.crushers],
    ['الإنتاج', DB.production],
    ['الأسطول', DB.vehicles],
    ['السائقون', DB.drivers],
    ['مصاريف_الأسطول', DB.vehicleExpenses],
    ['الأصول_الثابتة', DB.assets.map(a=>({...a, الإهلاك_المتراكم:assetAccumDep(a), القيمة_الدفترية:assetBookValue(a)}))],
    ['السندات', DB.vouchers],
  ];
  sheets.forEach(([name, data])=>{
    if(!data || !data.length) return;
    const ws = XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,28));
  });
  XLSX.writeFile(wb, `بيانات-النشاط-الكاملة-${todayStr()}.xlsx`);
  showToast('تم تصدير كل البيانات');
}

// ---------- Global helper for price autofill ----------
window.__fillPrice = function(sel, targetId){
  const opt = sel.options[sel.selectedIndex];
  const price = opt.getAttribute('data-price');
  if(price) document.getElementById(targetId).value = price;
};
window.__fillCost = function(sel, targetId){
  const opt = sel.options[sel.selectedIndex];
  const cost = opt.getAttribute('data-cost');
  if(cost) document.getElementById(targetId).value = cost;
};
window.__fillVehicleDriver = function(sel){
  const form = sel.form;
  if(sel.name==='vehicleId'){
    const opt = sel.options[sel.selectedIndex];
    const plate = opt.getAttribute('data-plate');
    if(plate) form.querySelector('[name="truckNo"]').value = plate;
  } else if(sel.name==='driverId'){
    const opt = sel.options[sel.selectedIndex];
    const name = opt.getAttribute('data-name');
    if(name) form.querySelector('[name="driver"]').value = name;
  }
};
window.__fillTripPrices = function(sel){
  const opt = sel.options[sel.selectedIndex];
  const form = sel.form;
  const cost = opt.getAttribute('data-cost');
  const price = opt.getAttribute('data-price');
  if(cost) form.querySelector('#tripPurchasePrice').value = cost;
  if(price) form.querySelector('#tripSalePrice').value = price;
  window.__calcTripValue(form,'purchase');
  window.__calcTripValue(form,'sale');
};
window.__fillVoucherInvoices = function(form){
  const type = form.querySelector('[name="type"]').value;
  const sel = form.querySelector('#voucherInvoiceId');
  const invoices = openInvoicesForVoucher(type, null);
  if(invoices.length===0){
    sel.innerHTML = `<option value="">لا توجد فواتير مستحقة</option>`;
    form.querySelector('#voucherAmount').value = '';
    return;
  }
  sel.innerHTML = invoices.map(inv=>{
    const partyLabel = type==='receipt' ? customerName(inv.customerId) : supplierName(inv.supplierId);
    const due = inv.total - inv.paid;
    return `<option value="${inv.id}" data-due="${due}">${partyLabel} — ${inv.date} — مستحق ${fmt(due)}</option>`;
  }).join('');
  window.__fillVoucherAmount(form);
};
window.__fillVoucherAmount = function(form){
  const sel = form.querySelector('#voucherInvoiceId');
  const opt = sel.options[sel.selectedIndex];
  if(opt){ const due = opt.getAttribute('data-due'); if(due) form.querySelector('#voucherAmount').value = due; }
};
window.__calcTripValue = function(form, side){
  if(side==='purchase'){
    const qty = parseFloat(form.querySelector('[name="purchaseQty"]').value)||0;
    const price = parseFloat(form.querySelector('[name="purchasePrice"]').value)||0;
    form.querySelector('#tripPurchaseValue').value = (qty*price) ? (qty*price).toFixed(2) : '';
  } else {
    const qty = parseFloat(form.querySelector('[name="saleQty"]').value)||0;
    const price = parseFloat(form.querySelector('[name="salePrice"]').value)||0;
    form.querySelector('#tripSaleValue').value = (qty*price) ? (qty*price).toFixed(2) : '';
  }
};

function attachHandlers(){

  const btnAddProduct = document.getElementById('btnAddProduct');

  });
  document.querySelectorAll('[data-del-product]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.products = DB.products.filter(p=>p.id!==b.dataset.delProduct);
    await saveDB(); showToast('تم حذف الصنف'); renderPage();
  }));

  // Crushers
  const btnAddCrusher = document.getElementById('btnAddCrusher');
  if(btnAddCrusher) btnAddCrusher.addEventListener('click', ()=> togglePanel('crusherFormPanel'));
  const cancelCrusher = document.getElementById('cancelCrusher');
  if(cancelCrusher) cancelCrusher.addEventListener('click', ()=> togglePanel('crusherFormPanel', false));
  const crusherForm = document.getElementById('crusherForm');
  if(crusherForm) crusherForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(crusherForm);
    DB.crushers.push({ id:uid(), name:f.get('name').trim(), location:f.get('location').trim(), dailyCapacity:parseFloat(f.get('dailyCapacity'))||0, unit:f.get('unit'), operatingCost:parseFloat(f.get('operatingCost'))||0 });
    await saveDB(); showToast('تم إضافة الكسارة'); renderPage();
  });
  document.querySelectorAll('[data-del-crusher]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.crushers = DB.crushers.filter(c=>c.id!==b.dataset.delCrusher);
    await saveDB(); showToast('تم حذف الكسارة'); renderPage();
  }));

  // Production (crusher output feeding inventory)
  const btnAddProduction = document.getElementById('btnAddProduction');
  if(btnAddProduction) btnAddProduction.addEventListener('click', ()=> togglePanel('productionFormPanel'));
  const cancelProduction = document.getElementById('cancelProduction');
  if(cancelProduction) cancelProduction.addEventListener('click', ()=> togglePanel('productionFormPanel', false));
  const productionForm = document.getElementById('productionForm');
  if(productionForm) productionForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(productionForm);
    const qty = parseFloat(f.get('qty'))||0;
    const cost = parseFloat(f.get('cost'))||0;
    const newName = f.get('newProductName').trim();
    const existingName = f.get('productName');
    let product;
    if(newName){
      const unitCost = qty>0 ? cost/qty : 0;
      product = { id:uid(), name:newName, unit:f.get('unit'), qty:0, cost:unitCost, price:unitCost*1.3 };
      DB.products.push(product);
    } else {
      product = DB.products.find(p=>p.name===existingName);
      if(!product){ showToast('اختر صنفاً أو اكتب اسم صنف جديد'); return; }
    }
    const newTotalQty = product.qty + qty;
    const unitCostThisRun = qty>0 ? cost/qty : 0;
    product.cost = newTotalQty>0 ? ((product.cost*product.qty)+(unitCostThisRun*qty))/newTotalQty : product.cost;
    product.qty = newTotalQty;
    if(qty>0) addStock(product.id, mainWarehouseId(), qty);
    DB.production.push({ id:uid(), date:f.get('date'), crusherId:f.get('crusherId'), productId:product.id, qty, cost });
    await saveDB(); showToast('تم تسجيل الإنتاج وإضافته للمخزون'); renderPage();
  });
  document.querySelectorAll('[data-del-production]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.production = DB.production.filter(p=>p.id!==b.dataset.delProduction);
    await saveDB(); showToast('تم حذف سجل الإنتاج'); renderPage();

  const vehicleForm = document.getElementById('vehicleForm');

    e.preventDefault();
    const f = new FormData(vehicleForm);
    DB.vehicles.push({ id:uid(), plateNo:f.get('plateNo').trim(), type:f.get('type'), owner:f.get('owner'), notes:f.get('notes').trim() });
    await saveDB(); showToast('تم إضافة السيارة'); renderPage();
  });
  document.querySelectorAll('[data-del-vehicle]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.vehicles = DB.vehicles.filter(v=>v.id!==b.dataset.delVehicle);

  if(fleetReportForm) fleetReportForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(fleetReportForm);
    document.getElementById('fleetReportResult').innerHTML = fleetReportTable(f.get('from')||null, f.get('to')||null);
  });

    e.preventDefault();
    const f = new FormData(transportForm);
    const date = f.get('date');
    const productId = f.get('productId')||null;
    const supplierId = f.get('supplierId')||'';
    const purchaseQty = parseFloat(f.get('purchaseQty'))||0;
    const purchasePrice = parseFloat(f.get('purchasePrice'))||0;
    const customerId = f.get('customerId')||'';
    const saleQty = parseFloat(f.get('saleQty'))||0;
    const salePrice = parseFloat(f.get('salePrice'))||0;
    const cost = parseFloat(f.get('cost'))||0;

    let linkedPurchaseId = null, linkedSaleId = null;
    const product = productId ? DB.products.find(p=>p.id===productId) : null;

    // Purchase side: add stock in
    if(supplierId && purchaseQty>0 && product){
      const newTotalQty = product.qty + purchaseQty;
      product.cost = newTotalQty>0 ? ((product.cost*product.qty)+(purchasePrice*purchaseQty))/newTotalQty : purchasePrice;
      product.qty = newTotalQty;
      addStock(product.id, mainWarehouseId(), purchaseQty);
      linkedPurchaseId = uid();
      DB.purchases.push({ id:linkedPurchaseId, date, supplierId, productId, qty:purchaseQty, price:purchasePrice, total:purchaseQty*purchasePrice, paid:0 });
    }
    // Sale side: remove stock out
    if(customerId && saleQty>0 && product){
      if(saleQty > product.qty){ showToast('كمية البيع أكبر من المتاح في المخزون بعد الشراء'); return; }
      product.qty -= saleQty;
      removeStock(product.id, mainWarehouseId(), saleQty);
      linkedSaleId = uid();
      DB.sales.push({ id:linkedSaleId, date, customerId, productId, qty:saleQty, price:salePrice, total:saleQty*salePrice, paid:0 });
    }

    const purchaseValue = purchaseQty*purchasePrice;
    const saleValue = saleQty*salePrice;
    DB.transport.push({
      id:uid(), date, driver:f.get('driver').trim(), truckNo:f.get('truckNo').trim(),
      vehicleId: f.get('vehicleId')||null, driverId: f.get('driverId')||null,
      from:f.get('from').trim(), to:f.get('to').trim(), productId,
      supplierId: supplierId||null, purchaseQty, purchasePrice, purchaseValue,
      customerId: customerId||null, saleQty, salePrice, saleValue,
      cost, profit: saleValue - purchaseValue - cost,
      linkedPurchaseId, linkedSaleId
    });
    await saveDB(); showToast('تم حفظ شيت الرحلة'); renderPage();
  });
  document.querySelectorAll('[data-del-transport]').forEach(b=>b.addEventListener('click', async ()=>{
    const trip = DB.transport.find(t=>t.id===b.dataset.delTransport);
    if(trip){
      const product = trip.productId ? DB.products.find(p=>p.id===trip.productId) : null;
      if(trip.linkedPurchaseId){
        DB.purchases = DB.purchases.filter(p=>p.id!==trip.linkedPurchaseId);
        if(product){ product.qty -= trip.purchaseQty; removeStock(product.id, mainWarehouseId(), trip.purchaseQty); }
      }
      if(trip.linkedSaleId){
        DB.sales = DB.sales.filter(s=>s.id!==trip.linkedSaleId);
        if(product){ product.qty += trip.saleQty; addStock(product.id, mainWarehouseId(), trip.saleQty); }
      }
    }
    DB.transport = DB.transport.filter(t=>t.id!==b.dataset.delTransport);
    await saveDB(); showToast('تم حذف الرحلة وأثرها على المخزون والفواتير المرتبطة'); renderPage();
  }));

  // Finance / expenses
  const btnAddExpense = document.getElementById('btnAddExpense');
  if(btnAddExpense) btnAddExpense.addEventListener('click', ()=> togglePanel('expenseFormPanel'));
  const cancelExpense = document.getElementById('cancelExpense');
  if(cancelExpense) cancelExpense.addEventListener('click', ()=> togglePanel('expenseFormPanel', false));
  const expenseForm = document.getElementById('expenseForm');
  if(expenseForm) expenseForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(expenseForm);
    DB.expenses.push({ id:uid(), date:f.get('date'), desc:f.get('desc').trim(), amount:parseFloat(f.get('amount'))||0 });
    await saveDB(); showToast('تم تسجيل المصروف'); renderPage();
  });
  document.querySelectorAll('[data-del-expense]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.expenses = DB.expenses.filter(x=>x.id!==b.dataset.delExpense);
    await saveDB(); showToast('تم حذف المصروف'); renderPage();
  }));

  // Contacts
  const customerForm = document.getElementById('customerForm');
  if(customerForm) customerForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(customerForm);
    DB.customers.push({ id:uid(), name:f.get('name').trim(), phone:f.get('phone').trim() });
    await saveDB(); showToast('تم إضافة العميل'); renderPage();
  });
  document.querySelectorAll('[data-del-customer]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.customers = DB.customers.filter(c=>c.id!==b.dataset.delCustomer);
    await saveDB(); showToast('تم حذف العميل'); renderPage();
  }));
  const supplierForm = document.getElementById('supplierForm');
  if(supplierForm) supplierForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(supplierForm);
    DB.suppliers.push({ id:uid(), name:f.get('name').trim(), phone:f.get('phone').trim() });
    await saveDB(); showToast('تم إضافة المورد'); renderPage();
  });
  document.querySelectorAll('[data-del-supplier]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.suppliers = DB.suppliers.filter(s=>s.id!==b.dataset.delSupplier);
    await saveDB(); showToast('تم حذف المورد'); renderPage();
  }));

  // Warehouses
  const btnAddWarehouse = document.getElementById('btnAddWarehouse');
  if(btnAddWarehouse) btnAddWarehouse.addEventListener('click', ()=> togglePanel('warehouseFormPanel'));
  const cancelWarehouse = document.getElementById('cancelWarehouse');
  if(cancelWarehouse) cancelWarehouse.addEventListener('click', ()=> togglePanel('warehouseFormPanel', false));
  const warehouseForm = document.getElementById('warehouseForm');
  if(warehouseForm) warehouseForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(warehouseForm);
    DB.warehouses.push({ id:uid(), name:f.get('name').trim(), location:f.get('location').trim() });
    await saveDB(); showToast('تم إضافة المخزن'); renderPage();
  });
  document.querySelectorAll('[data-del-warehouse]').forEach(b=>b.addEventListener('click', async ()=>{
    const wid = b.dataset.delWarehouse;
    const hasStock = DB.stock.some(s=>s.warehouseId===wid && s.qty>0.0001);
    if(hasStock){ showToast('لا يمكن حذف مخزن يحتوي كمية مخزون — رحّل الكميات أولاً'); return; }
    DB.warehouses = DB.warehouses.filter(w=>w.id!==wid);
    DB.stock = DB.stock.filter(s=>s.warehouseId!==wid);
    await saveDB(); showToast('تم حذف المخزن'); renderPage();
  }));
  const transferForm = document.getElementById('transferForm');
  if(transferForm) transferForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(transferForm);
    const productId = f.get('productId'), fromWarehouseId = f.get('fromWarehouseId'), toWarehouseId = f.get('toWarehouseId');
    const qty = parseFloat(f.get('qty'))||0;
    if(!productId || qty<=0){ showToast('أدخل بيانات صحيحة'); return; }
    if(fromWarehouseId===toWarehouseId){ showToast('اختر مخزنين مختلفين'); return; }
    const available = stockQty(productId, fromWarehouseId);
    if(qty > available){ showToast('الكمية أكبر من المتاح في المخزن المصدر'); return; }
    removeStock(productId, fromWarehouseId, qty);
    addStock(productId, toWarehouseId, qty);
    DB.transfers.push({ id:uid(), date:todayStr(), productId, fromWarehouseId, toWarehouseId, qty });
    await saveDB(); showToast('تم تنفيذ التحويل'); renderPage();
  });
  document.querySelectorAll('[data-del-transfer]').forEach(b=>b.addEventListener('click', async ()=>{
    const t = DB.transfers.find(x=>x.id===b.dataset.delTransfer);
    if(t){ addStock(t.productId, t.fromWarehouseId, t.qty); removeStock(t.productId, t.toWarehouseId, t.qty); }
    DB.transfers = DB.transfers.filter(x=>x.id!==b.dataset.delTransfer);
    await saveDB(); showToast('تم حذف التحويل وعكس أثره'); renderPage();
  }));

  // Fixed assets
  const btnAddAsset = document.getElementById('btnAddAsset');
  if(btnAddAsset) btnAddAsset.addEventListener('click', ()=> togglePanel('assetFormPanel'));
  const cancelAsset = document.getElementById('cancelAsset');
  if(cancelAsset) cancelAsset.addEventListener('click', ()=> togglePanel('assetFormPanel', false));
  const assetForm = document.getElementById('assetForm');
  if(assetForm) assetForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(assetForm);
    DB.assets.push({
      id:uid(), name:f.get('name').trim(), category:f.get('category'), purchaseDate:f.get('purchaseDate'),
      cost:parseFloat(f.get('cost'))||0, usefulLife:parseFloat(f.get('usefulLife'))||1,
      salvage:parseFloat(f.get('salvage'))||0, location:f.get('location').trim()
    });
    await saveDB(); showToast('تم إضافة الأصل'); renderPage();
  });
  document.querySelectorAll('[data-del-asset]').forEach(b=>b.addEventListener('click', async ()=>{
    DB.assets = DB.assets.filter(a=>a.id!==b.dataset.delAsset);
    await saveDB(); showToast('تم حذف الأصل'); renderPage();
  }));

  // Vouchers (receipts & payments)
  const btnAddVoucher = document.getElementById('btnAddVoucher');
  if(btnAddVoucher) btnAddVoucher.addEventListener('click', ()=>{
    togglePanel('voucherFormPanel');
    const vf = document.getElementById('voucherForm');
    if(vf) window.__fillVoucherInvoices(vf);
  });
  const cancelVoucher = document.getElementById('cancelVoucher');
  if(cancelVoucher) cancelVoucher.addEventListener('click', ()=> togglePanel('voucherFormPanel', false));
  const voucherForm = document.getElementById('voucherForm');
  if(voucherForm) voucherForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(voucherForm);
    const type = f.get('type');
    const invoiceId = f.get('invoiceId');
    let amount = parseFloat(f.get('amount'))||0;
    if(!invoiceId){ showToast('لا توجد فاتورة لربط السند بها'); return; }
    if(type==='receipt'){
      const inv = DB.sales.find(s=>s.id===invoiceId);
      if(!inv){ showToast('الفاتورة غير موجودة'); return; }
      const due = inv.total - inv.paid;
      if(amount<=0 || amount>due+0.001){ showToast('المبلغ غير صحيح — أكبر من المستحق'); return; }
      inv.paid += amount;
      DB.vouchers.push({ id:uid(), date:f.get('date'), type, partyId:inv.customerId, invoiceId, amount, desc:f.get('desc').trim() });
    } else {
      const inv = DB.purchases.find(p=>p.id===invoiceId);
      if(!inv){ showToast('الفاتورة غير موجودة'); return; }
      const due = inv.total - inv.paid;
      if(amount<=0 || amount>due+0.001){ showToast('المبلغ غير صحيح — أكبر من المستحق'); return; }
      inv.paid += amount;
      DB.vouchers.push({ id:uid(), date:f.get('date'), type, partyId:inv.supplierId, invoiceId, amount, desc:f.get('desc').trim() });
    }
    await saveDB(); showToast('تم حفظ السند'); renderPage();
  });
  document.querySelectorAll('[data-del-voucher]').forEach(b=>b.addEventListener('click', async ()=>{
    const v = DB.vouchers.find(x=>x.id===b.dataset.delVoucher);
    if(v){
      if(v.type==='receipt'){ const inv = DB.sales.find(s=>s.id===v.invoiceId); if(inv) inv.paid -= v.amount; }
      else { const inv = DB.purchases.find(p=>p.id===v.invoiceId); if(inv) inv.paid -= v.amount; }
    }
    DB.vouchers = DB.vouchers.filter(x=>x.id!==b.dataset.delVoucher);
    await saveDB(); showToast('تم حذف السند وعكس أثره على الفاتورة'); renderPage();
  }));

  // Backup / export
  const btnBackupDownload = document.getElementById('btnBackupDownload');
  if(btnBackupDownload) btnBackupDownload.addEventListener('click', downloadBackup);
  const btnBackupRestoreTrigger = document.getElementById('btnBackupRestoreTrigger');
  const backupRestoreInput = document.getElementById('backupRestoreInput');
  if(btnBackupRestoreTrigger && backupRestoreInput) btnBackupRestoreTrigger.addEventListener('click', ()=>{
    if(confirm('سيتم استبدال كل البيانات الحالية بالنسخة المستوردة. هل تريد المتابعة؟')) backupRestoreInput.click();
  });
  if(backupRestoreInput) backupRestoreInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) restoreBackup(file);
  });
  const btnExportAllExcel = document.getElementById('btnExportAllExcel');
  if(btnExportAllExcel) btnExportAllExcel.addEventListener('click', exportAllExcel);
}

// ---------- Attachments ----------
function attachBadge(entity){
  if(!entity || !entity.id) return '';
  const n = DB.attachments.filter(a=>a.key.endsWith(':'+entity.id)).length;
  return n ? `<span class="attach-badge">${n}</span>` : '';
}
let currentAttachKey = null;
function attachAttachButtons(){
  document.querySelectorAll('[data-attach]').forEach(b=>{
    b.addEventListener('click', ()=> openAttachModal(b.dataset.attach));
  });
  const closeBtn = document.getElementById('attachModalClose');
  if(closeBtn) closeBtn.onclick = closeAttachModal;
  const overlay = document.getElementById('attachModalOverlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target===overlay) closeAttachModal(); };
  const fileInput = document.getElementById('attachFileInput');
  if(fileInput) fileInput.onchange = handleAttachFile;
}
function openAttachModal(key){
  currentAttachKey = key;
  document.getElementById('attachModalOverlay').classList.add('show');
  renderAttachList();
}
function closeAttachModal(){
  document.getElementById('attachModalOverlay').classList.remove('show');
  currentAttachKey = null;
  const fi = document.getElementById('attachFileInput');
  if(fi) fi.value = '';
}
function renderAttachList(){
  const list = document.getElementById('attachList');
  if(!list) return;
  const items = DB.attachments.filter(a=>a.key===currentAttachKey);
  list.innerHTML = items.length ? items.map(a=>`
    <div class="attach-item">
      <a href="${a.dataURL}" download="${a.name}" target="_blank" rel="noopener">📎 ${a.name}</a>
      <button class="tag-del" data-del-attach="${a.id}">🗑️</button>
    </div>`).join('') : `<div class="attach-empty">لا توجد مرفقات بعد لهذا العنصر</div>`;
  list.querySelectorAll('[data-del-attach]').forEach(b=> b.addEventListener('click', async ()=>{
    DB.attachments = DB.attachments.filter(a=>a.id!==b.dataset.delAttach);
    await saveDB(); renderAttachList(); renderPage();
  }));
}
async function handleAttachFile(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!currentAttachKey) return;
  if(file.size > 6*1024*1024){ showToast('الملف كبير جداً — الحد الأقصى 6MB'); e.target.value=''; return; }
  try{
    const dataURL = await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = ()=> reject(r.error);
      r.readAsDataURL(file);
    });
    DB.attachments.push({ id:uid(), key:currentAttachKey, name:file.name, type:file.type, size:file.size, date:todayStr(), dataURL });
    await saveDB();
    e.target.value = '';
    renderAttachList();
    renderPage();
    showToast('تم إضافة المرفق');
  }catch(err){
    showToast('تعذرت إضافة المرفق');
  }
}

function togglePanel(id, show){
  const el = document.getElementById(id);
  if(!el) return;
  if(show===undefined) show = el.style.display==='none';
  el.style.display = show ? 'block' : 'none';
}

// ---------- Init ----------
(async function init(){
  document.getElementById('mainArea').innerHTML = `<div class="empty-state"><div class="icon">⛰️</div><p>جارٍ تحميل البيانات...</p></div>`;
  await loadDB();
  renderNav();
  renderPage();
})();
</script>
